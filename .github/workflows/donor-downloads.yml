name: Build donor data and downloads
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ClaudeFiles/**'
      - 'scripts/build-donors.py'
      - 'scripts/generate-donor-downloads.mjs'
      - 'scripts/write-donor-workbook.py'
      - 'assets/js/donor-data.js'
      - 'assets/js/donor-groups.js'
      - 'assets/js/business-data.js'
      - '.github/workflows/donor-downloads.yml'
permissions:
  contents: write
concurrency:
  group: donor-downloads
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl==3.1.5
      - name: Build the canonical dataset from ClaudeFiles
        run: python scripts/build-donors.py
      - run: node --test tests/*.test.mjs
      - name: Generate and verify both Excel workbooks and all CSVs
        run: node scripts/generate-donor-downloads.mjs
      - name: Publish generated data and downloads
        run: |
          git config user.name "POPC Data"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/donors.json assets/js/donor-config.js data/downloads
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Rebuild donor data and downloads from ClaudeFiles"
          git pull --rebase origin main
          git push origin HEAD:main
