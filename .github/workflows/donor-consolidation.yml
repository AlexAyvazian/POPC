name: Consolidate donor sources
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/audit-donor-source.mjs', 'scripts/migrate-donors.py', '.github/workflows/donor-consolidation.yml']
permissions:
  contents: write
concurrency:
  group: donor-consolidation
  cancel-in-progress: false
jobs:
  consolidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl==3.1.5
      - name: Extract only missing source information before removal
        run: node scripts/audit-donor-source.mjs
      - name: Replace all old donor files and loaders
        run: python scripts/migrate-donors.py
      - name: Check JavaScript syntax
        run: find assets data functions scripts tests -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n 1 node --check
      - name: Reconcile all donors, receipts, chart models and links
        run: node --test tests/*.test.mjs
      - name: Regenerate and verify both workbooks and all table downloads
        run: node scripts/generate-donor-downloads.mjs
      - run: npm install --no-save playwright@1.56.0
      - run: npx playwright install --with-deps chromium
      - name: Verify all pages and charts in Chromium
        run: node tests/browser-smoke.mjs
      - name: Verify the new build is reproducible
        run: |
          cp data/donors.json /tmp/donors-first.json
          cp assets/js/donor-config.js /tmp/donor-config-first.js
          python scripts/build-donors.py
          cmp data/donors.json /tmp/donors-first.json
          cmp assets/js/donor-config.js /tmp/donor-config-first.js
      - name: Publish the verified replacement and deletions
        run: |
          git config user.name "POPC Data"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          git add -u
          git add ClaudeFiles/receipt-details.json data/donors.json assets/js/donor-config.js assets/js/donor-data.js assets/js/business-data.js assets/js/committee-receipts.js scripts/build-donors.py tests/donor-data.test.mjs documents/notes/DONOR-SOURCES.json
          git commit -m "Replace all legacy donor sources with the ClaudeFiles pipeline"
          git pull --rebase origin main
          git push origin HEAD:main
