name: Refresh Change.org petition preview
# Captures the live petition hero and signature card.

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
  push:
    branches: [main]
    paths:
      - 'pages/petition.html'
      - 'assets/css/petition.css'
      - 'tests/petition-preview.test.mjs'
      - 'scripts/capture-petition-preview.py'
      - '.github/workflows/petition-preview.yml'

permissions:
  contents: write

concurrency:
  group: petition-preview
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node --test tests/petition-preview.test.mjs
      - run: pip install playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/capture-petition-preview.py
      - name: Verify screenshot
        run: test -s assets/images/petition-change-org-live.png
      - name: Publish refreshed preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/petition-change-org-live.png data/petition/petition-change-org-live.json
          if git diff --cached --quiet; then
            echo "Preview unchanged."
          else
            git commit -m "Refresh live Change.org petition preview"
            git push
          fi
