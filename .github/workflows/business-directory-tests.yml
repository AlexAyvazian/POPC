name: Business directory tests

on:
  push:
    branches: [main]
    paths:
      - 'business-identities.js'
      - 'business-directory-data.js'
      - 'business-directory.js'
      - 'business-directory.test.mjs'
      - 'business-directory-unreviewed.mjs'
      - 'research-data.js'
      - 'transactions.html'
      - 'combined-contributions.html'
      - 'schumer-identities.js'
      - 'schumer-business-directory-data.js'
      - 'schumer-business-directory.js'
      - 'schumer-business-directory.test.mjs'
      - 'schumer-research-data.js'
      - 'schumer-combined-contributions.js'
      - 'schumer-combined-contributions.html'
      - 'schumer-committee.js'
      - 'friends-of-schumer-pac.html'
      - 'impact-pac.html'
      - 'smp-pac.html'
      - 'spreadsheets/schumer_remaining_entity_research_COMPLETED.csv'
      - '.github/workflows/business-directory-tests.yml'
  pull_request:
    paths:
      - 'business-identities.js'
      - 'business-directory-data.js'
      - 'business-directory.js'
      - 'business-directory.test.mjs'
      - 'business-directory-unreviewed.mjs'
      - 'research-data.js'
      - 'transactions.html'
      - 'combined-contributions.html'
      - 'spreadsheets/schumer_remaining_entity_research_COMPLETED.csv'
      - 'smp-pac.html'
      - 'impact-pac.html'
      - 'friends-of-schumer-pac.html'
      - 'schumer-committee.js'
      - 'schumer-combined-contributions.html'
      - 'schumer-combined-contributions.js'
      - 'schumer-research-data.js'
      - 'schumer-business-directory.test.mjs'
      - 'schumer-business-directory.js'
      - 'schumer-business-directory-data.js'
      - 'schumer-identities.js'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test business-directory.test.mjs schumer-business-directory.test.mjs
      - run: node business-directory-unreviewed.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: business-directory-unreviewed
          path: unreviewed-business-identities.json
